        <div class="form">
        <article id="contactform">
        <h2 class="contact">Our Contact Form</h2>
        <form action="https://formspree.io/f/xdeowdwr"
            method="post">
            
                
                <p>
                    <label class="label" for="email">Email:</label>
                    <input class="input" type="email" id="email" name="email" 
                    placeholder="ex@gmail.com" 
                    autocomplete="on" required>
                </p>
                <br>
                <p>
                    <label class="label" for="name">Name:</label>
                    <input class="input" type="text" id="name" name="name" 
                    placeholder="Enter your full name" 
                    autocomplete="on" required>
                </p>
                <br>
                <p>
                    <label class="label" for="message">Add your message:</label>
                    <textarea class="input" id="message" rows="5" cols="30" name="message" 
                        placeholder="Enter your message" 
                        autocomplete="on" ></textarea>
                </p>
            
            <br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
            </div>
        </form>
